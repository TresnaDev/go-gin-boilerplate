services:
  postgres:
    image: postgres:16-alpine
    container_name: go-rest-boilerplate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-go_boilerplate}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-go_boilerplate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: go-rest-boilerplate-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env: inside the compose network the DB is reached by
      # service name, not localhost.
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: go-rest-boilerplate-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
